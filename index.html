const loadSettings = () => {
  try {
    const saved = localStorage.getItem('evren_ai_settings');
    if (!saved) return DEFAULT_SETTINGS;
    const parsed = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
    // Eski/yanlış kayıtlı adresleri otomatik olarak yeni proxy adresine çevir
    const cleaned = (parsed.baseUrl || '').trim().replace(/\/+$/, '');
    if (!cleaned || OLD_BASE_URLS.includes(cleaned)) {
      parsed.baseUrl = DEFAULT_BASE_URL;
    } else {
      parsed.baseUrl = cleaned;
    }
    return parsed;
  } catch (e) {
    return DEFAULT_SETTINGS;
  }
};

const loadCategories = () => {
  try {
    const saved = JSON.parse(localStorage.getItem('evren_ai_categories') || '[]');
    return Array.from(new Set([DEFAULT_CATEGORY, ...(Array.isArray(saved) ? saved : [])]))
      .filter(category => typeof category === 'string' && category.trim())
      .map(category => category.trim());
  } catch (e) {
    return [DEFAULT_CATEGORY];
  }
};

// STATİK MODEL TANIMLARI
const DEFAULT_MODELS = [
  { id: 'auto', name: 'Auto (Otomatik Yönlendirme)', desc: 'EVREN isteğe göre en uygun modeli kendisi seçer.' },
  { id: 'glm-5.3', name: 'GLM-5.3', desc: 'Derin akıl yürütme, kod ve uzun belge analizi.' },
  { id: 'deepseek-v4.1-flash', name: 'DeepSeek V4.1 Flash', desc: 'Hızlı kod/ajan modeli, 1M bağlam.' },
  { id: 'mimo-v2.6-pro', name: 'Mimo V2.6 Pro', desc: 'Uzun ajan görevleri; görsel, video ve ses girdisi.' },
  { id: 'qwen3.8-flash-next', name: 'Qwen 3.8 Flash Next', desc: 'Hızlı sohbet, vibe coding ve ajan işleri.' },
  { id: 'gemma-4-31b', name: 'Gemma 4 31B', desc: 'Görüntü anlama, grafik/ekran ve el yazısı okuma.' },
  { id: 'qwen3-vl-30b', name: 'Qwen 3-VL 30B', desc: 'Görsel ve video anlamaya odaklı model.' }
];

const isChatModel = (model) => {
  const id = typeof model === 'string' ? model : (model?.id || model?.name || '');
  const task = typeof model === 'object' ? (model?.task || model?.type || '') : '';
  const capabilities = typeof model === 'object' ? model?.capabilities : '';
  const capabilityText = Array.isArray(capabilities) ? capabilities.join(' ') : JSON.stringify(capabilities || '');
  const metadata = `${id} ${task} ${capabilityText}`;

  return !/(^|[-_])(asr|audio|speech|stt|transcri|tts|embedding|rerank)([-_]|$)/i.test(metadata);
};

const loadSelectedModel = () => {
  try {
    const saved = localStorage.getItem('evren_ai_selected_model');
    return saved && isChatModel(saved) ? saved : 'auto';
  } catch (e) {
    return 'auto';
  }
};

const ChatRow = ({ chat, activeChatId, setActiveChatId, togglePin, renameChat, deleteChat, assignCategory, categoryColors }) => (

      <button onClick={e => togglePin(chat.id, e)} title={chat.pinned ? 'Sabitlemeyi kaldır' : 'Sohbeti sabitle'} className="p-1">
        <IconPin pinned={!!chat.pinned}/>
      </button>
    </div>
    <div className="hidden group-hover:flex items-center gap-1 px-3 pb-2">
      <button onClick={e => renameChat(chat.id, e)} className="text-[10px] text-slate-400 hover:text-white">Adlandır</button>
      <button onClick={e => assignCategory(chat.id, e)} className="text-[10px] text-slate-400 hover:text-white">Kategori</button>
      <button onClick={e => deleteChat(chat.id, e)} className="text-[10px] text-rose-400 hover:text-rose-300">Sil</button>

function App() {
  const [user, setUser] = useState(null);
  const [isRegistering, setIsRegistering] = useState(false);
  const [loadingAuth, setLoadingAuth] = useState(false);
  const [emailInput, setEmailInput] = useState('');
  const [passwordInput, setPasswordInput] = useState('');

  const [chats, setChats] = useState([]);
  const [activeChatId, setActiveChatId] = useState(null);

  const [settings, setSettings] = useState(loadSettings);

  const [availableModels, setAvailableModels] = useState(DEFAULT_MODELS);
  const [selectedModel, setSelectedModel] = useState(loadSelectedModel);
  const [categories, setCategories] = useState(loadCategories);
  const [selectedCategory, setSelectedCategory] = useState('Tümü');
  const [modelDropdownOpen, setModelDropdownOpen] = useState(false);
  const [isFetchingModels, setIsFetchingModels] = useState(false);

  const cleanBaseUrl = (url) => (url || '').trim().replace(/\/+$/, '');

  const handleFetchModelsFromApi = async () => {
    setIsFetchingModels(true);
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (settings.apiKey) headers['Authorization'] = `Bearer ${settings.apiKey}`;

      const res = await fetch(`${cleanBaseUrl(settings.baseUrl)}/models`, { method: 'GET', headers });
      if (res.ok) {
        const data = await res.json();
        let rawList = Array.isArray(data) ? data : (data.data || []);

        if (rawList.length > 0) {
          const fetchedList = rawList.map(m => {
            const modelId = typeof m === 'string' ? m : (m.id || m.name);
            if (!isChatModel(m)) return null;
            const staticMatch = DEFAULT_MODELS.find(dm => dm.id === modelId);
            return {
              id: modelId,
              name: staticMatch ? staticMatch.name : modelId,
              desc: staticMatch ? staticMatch.desc : 'Evren AI Modeli'
            };
          }).filter(Boolean);
          // "auto" seçeneği listede yoksa başa ekle
          if (!fetchedList.find(m => m.id === 'auto')) {
            fetchedList.unshift(DEFAULT_MODELS[0]);
          }
          setAvailableModels(fetchedList);
          setSelectedModel(currentModel => fetchedList.some(m => m.id === currentModel) ? currentModel : 'auto');
          setIsFetchingModels(false);
          return;
        }
      }
    } catch (err) {
      console.warn("API modelleri çekilirken engel oluştu. Tanımlı statik modeller kullanılıyor.");
    } finally {
      setIsFetchingModels(false);
    }
    setAvailableModels(DEFAULT_MODELS);
    setSelectedModel(currentModel => DEFAULT_MODELS.some(m => m.id === currentModel) ? currentModel : 'auto');
  };

  useEffect(() => {
    handleFetchModelsFromApi();
  }, [settings.baseUrl]);

  useEffect(() => {
    try {
      localStorage.setItem('evren_ai_selected_model', selectedModel);
    } catch (e) {}
  }, [selectedModel]);

  const loadUserChats = async (userId) => {
    if (!supabaseClient || !userId) return;
    try {
      const { data, error } = await supabaseClient
        .from('chats')
        .select('*, messages(*)')
        .eq('user_id', userId)
        .order('updated_at', { ascending: false });

      if (!error && data) {
        const formatted = data.map(c => ({
          ...c,
          title: normalizeText(c.title || 'Yeni Sohbet'),
          folder: normalizeText(c.folder || DEFAULT_CATEGORY),
          messages: (c.messages || []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
        }));
        const loadedCategories = Array.from(new Set([
          ...loadCategories(),
          ...formatted.map(chat => chat.folder).filter(Boolean)
        ]));
        setCategories(loadedCategories);
        setChats(formatted);
        if (formatted.length > 0) setActiveChatId(formatted[0].id);
      }
    } catch (err) {
      console.error("Sohbetler yüklenemedi:", err);
    }
  };

  useEffect(() => {
    if (supabaseClient) {
      const hash = window.location.hash;
      if (hash.includes("error_code") || hash.includes("error=")) {
        const errorDescription = new URLSearchParams(hash.substring(1)).get("error_description") || "Oturum bağlantısı geçersiz.";
        window.location.href = "oturumbasarisiz.html?error=" + encodeURIComponent(errorDescription);
        return;
      }

      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        const currentUser = session?.user ?? null;
        setUser(currentUser);
        if (currentUser) loadUserChats(currentUser.id);
      });

      const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
        const currentUser = session?.user ?? null;
        setUser(currentUser);
        if (currentUser) loadUserChats(currentUser.id);
      });

      return () => subscription.unsubscribe();
    }
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem('evren_ai_settings', JSON.stringify(settings));
    } catch (e) {}
  }, [settings]);

  const handleAuthSubmit = async (e) => {
    e.preventDefault();
    if (!emailInput.trim() || !passwordInput.trim()) {
      alert('Lütfen e-posta adresinizi ve şifrenizi girin!');
      return;
    }
    if (!supabaseClient) {
      alert("Lütfen index.html dosyasının en üstündeki SUPABASE_URL ve SUPABASE_ANON_KEY alanlarını kendi Supabase bilgilerinizle doldurun!");
      return;
    }

    setLoadingAuth(true);
    try {
      if (isRegistering) {
        const { error } = await supabaseClient.auth.signUp({
          email: emailInput.trim(),
          password: passwordInput.trim(),
        });
        if (error) {
          window.location.href = "oturumbasarisiz.html?error=" + encodeURIComponent(error.message);
        } else {
          alert('Kayıt başarılı! Lütfen e-postanıza gelen onay bağlantısına tıklayın.');
          setIsRegistering(false);
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: emailInput.trim(),
          password: passwordInput.trim(),
        });
        if (error) {
          window.location.href = "oturumbasarisiz.html?error=" + encodeURIComponent(error.message);
        } else {
          setUser(data.user);
          loadUserChats(data.user.id);
        }
      }
    } catch (err) {
      alert("İşlem sırasında bir hata oluştu: " + err.message);
    } finally {
      setLoadingAuth(false);
    }
  };

  const handleLogout = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    setUser(null);
    setChats([]);
  };

  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [searchQuery, setSearchQuery] = useState('');
  const [inputPrompt, setInputPrompt] = useState('');
  const [attachedFiles, setAttachedFiles] = useState([]);
  const [showSettings, setShowSettings] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [activeArtifact, setActiveArtifact] = useState(null);
  const [dragActive, setDragActive] = useState(false);
  const [sortMode, setSortMode] = useState('recent');
  const [categoryColors, setCategoryColors] = useState({});
  const [theme, setTheme] = useState('dark');
  const [fontScale, setFontScale] = useState('normal');
  const [compactMode, setCompactMode] = useState(false);
  const [lastUsage, setLastUsage] = useState(null);
  const [lastResponseTime, setLastResponseTime] = useState(null);
  const activeChat = chats.find(c => c.id === activeChatId) || null;
  const messagesEndRef = useRef(null);
  const fileInputRef = useRef(null);
  const searchInputRef = useRef(null);
  const abortControllerRef = useRef(null);
  const lastPromptRef = useRef('');

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('evren_ai_view_preferences') || '{}');
      setCategoryColors(saved.categoryColors || {});
      setTheme(saved.theme || 'dark');
      setFontScale(saved.fontScale || 'normal');
      setCompactMode(Boolean(saved.compactMode));
    } catch (e) {}
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem('evren_ai_view_preferences', JSON.stringify({ categoryColors, theme, fontScale, compactMode }));
    } catch (e) {}
  }, [categoryColors, theme, fontScale, compactMode]);

  useEffect(() => {
    const onKeyDown = (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        searchInputRef.current?.focus();
      }
      if (event.key === 'Escape' && isGenerating) abortControllerRef.current?.abort();
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [isGenerating]);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [activeChat?.messages, isGenerating]);

  const handleNewChat = async () => {
    const newId = `chat-${Date.now()}`;
    const newChatObj = { id: newId, user_id: user.id, title: 'Yeni Sohbet', folder: DEFAULT_CATEGORY, pinned: false, messages: [] };
    setChats(prev => [newChatObj, ...prev]);
    setActiveChatId(newId);
    setActiveArtifact(null);

    if (supabaseClient && user?.id) {
      await supabaseClient.from('chats').insert([{
        id: newId,
        user_id: user.id,
        title: 'Yeni Sohbet',
        folder: DEFAULT_CATEGORY,
        pinned: false
      }]);
    }
  };

  const persistCategories = (nextCategories) => {
    setCategories(nextCategories);
    try {
      localStorage.setItem('evren_ai_categories', JSON.stringify(nextCategories));
    } catch (e) {}
  };

  const createCategory = () => {
    const name = window.prompt('Yeni kategori adı:');
    if (name === null) return;
    const trimmed = normalizeText(name).trim();
    if (!trimmed) return;
    if (categories.some(category => category.toLowerCase() === trimmed.toLowerCase())) {
      setSelectedCategory(trimmed);
      return;
    }
    persistCategories([...categories, trimmed]);
    setSelectedCategory(trimmed);
  };

  const renameChat = async (chatId, event) => {
    event.stopPropagation();
    const target = chats.find(chat => chat.id === chatId);
    if (!target) return;
    const enteredTitle = window.prompt('Sohbet adı:', target.title);
    if (enteredTitle === null) return;
    const nextTitle = normalizeText(enteredTitle).trim();
    if (!nextTitle || nextTitle === target.title) return;
    setChats(current => current.map(chat => chat.id === chatId ? { ...chat, title: nextTitle } : chat));
    if (supabaseClient) await supabaseClient.from('chats').update({ title: nextTitle }).eq('id', chatId);
  };

  const deleteChat = async (chatId, event) => {
    event.stopPropagation();
    const target = chats.find(chat => chat.id === chatId);
    if (!target || !window.confirm(`"${target.title}" sohbeti silinsin mi?`)) return;
    setChats(current => current.filter(chat => chat.id !== chatId));
    if (activeChatId === chatId) setActiveChatId(null);
    if (supabaseClient) {
      const { error } = await supabaseClient.from('chats').delete().eq('id', chatId);
      if (error) console.error('Sohbet silinemedi:', error);
    }
  };

  const assignCategory = async (chatId, event) => {
    event.stopPropagation();
    const target = chats.find(chat => chat.id === chatId);
    if (!target) return;
    const nextCategory = window.prompt(`Kategori (${categories.join(', ')}):`, target.folder || DEFAULT_CATEGORY);
    if (nextCategory === null) return;
    const trimmed = normalizeText(nextCategory).trim();
    if (!trimmed || trimmed === target.folder) return;
    const nextCategories = categories.some(category => category.toLowerCase() === trimmed.toLowerCase())
      ? categories
      : [...categories, trimmed];
    persistCategories(nextCategories);
    setChats(current => current.map(chat => chat.id === chatId ? { ...chat, folder: trimmed } : chat));
    if (supabaseClient) await supabaseClient.from('chats').update({ folder: trimmed }).eq('id', chatId);
  };

  const togglePin = async (chatId, e) => {
    e.stopPropagation();
    const target = chats.find(c => c.id === chatId);
    if (!target) return;
    const newPinned = !target.pinned;
    setChats(chats.map(c => c.id === chatId ? { ...c, pinned: newPinned } : c));
    if (supabaseClient) {
      await supabaseClient.from('chats').update({ pinned: newPinned }).eq('id', chatId);
    }
  };

  const addFiles = (files) => {
    files = Array.from(files || []);
    if (!files.length) return;
    const accepted = [];
    files.forEach(file => {
      if (file.size > MAX_ATTACHMENT_SIZE) {
        window.alert(`${file.name}: dosya boyutu 10 MB sınırını aşıyor.`);
        return;
      }
      if (!SUPPORTED_ATTACHMENT_TYPES.has(file.type)) {
        window.alert(`${file.name}: desteklenmeyen dosya türü. Metin, kod, PDF veya PNG/JPEG/WebP/GIF seçin.`);
        return;
      }
      accepted.push({
        file,
        name: file.name,
        type: file.type || 'application/octet-stream',
        size: file.size,
        sizeLabel: `${(file.size / 1024).toFixed(1)} KB`
      });
    });
    const prepared = accepted.map(item => ({
      ...item,
      previewUrl: item.type.startsWith('image/') || item.type === 'application/pdf' ? URL.createObjectURL(item.file) : null
    }));
    setAttachedFiles(prev => [...prev, ...prepared]);
    prepared.filter(item => item.type.startsWith('text/') || item.type === 'application/json' || item.type === 'application/javascript').forEach(item => {
      item.file.text().then(text => {
        setAttachedFiles(current => current.map(existing => existing.file === item.file ? { ...existing, textPreview: text.slice(0, 1200) } : existing));
      }).catch(() => {});
    });
  };

  const handleFileUpload = (e) => {
    addFiles(e.target.files);
    e.target.value = '';
  };

  const handleDrop = (event) => {
    event.preventDefault();
    setDragActive(false);
    addFiles(event.dataTransfer.files);
  };

  const handlePaste = (event) => {
    const imageItem = Array.from(event.clipboardData?.items || [])
      .find(item => item.kind === 'file' && item.type.startsWith('image/'));
    if (!imageItem) return;

    const blob = imageItem.getAsFile();
    if (!blob) return;
    event.preventDefault();
    const extension = blob.type.split('/')[1]?.replace('jpeg', 'jpg') || 'png';
    const pastedFile = new File(
      [blob],
      `panodan-yapistirilan-resim-${Date.now()}.${extension}`,
      { type: blob.type, lastModified: Date.now() }
    );
    addFiles([pastedFile]);
  };

  const buildAttachmentContext = async (files) => {
    if (!files.length) return '';
    const entries = await Promise.all(files.map(async ({ file, name, type, size }) => {
      let preview = '';
      if (type.startsWith('text/') || type === 'application/json') {
        preview = (await file.text()).slice(0, 8000);
      }
      return `[Ek dosya: ${name}; tür: ${type}; boyut: ${size} byte]${preview ? `\nİçerik önizlemesi:\n${preview}` : ''}`;
    }));
    return `\n\nEk dosyalar (içerik yalnızca metin/JSON dosyalarında ilk 8000 karakterle sınırlıdır):\n${entries.join('\n\n')}`;
  };

  const handleSendMessage = async (promptToSend) => {
    const text = promptToSend || inputPrompt;
    if (!text.trim() && attachedFiles.length === 0) return;
    const attachmentContext = await buildAttachmentContext(attachedFiles);
    const requestText = `${text.trim()}${attachmentContext}`;
    lastPromptRef.current = requestText;

    let currentChatId = activeChatId;
    let targetChat = activeChat;

    if (!targetChat) {
      currentChatId = `chat-${Date.now()}`;
      const newTitle = text.slice(0, 30) || 'Yeni Sohbet';
      targetChat = { id: currentChatId, user_id: user.id, title: newTitle, folder: DEFAULT_CATEGORY, pinned: false, messages: [] };
      setChats(prev => [targetChat, ...prev]);
      setActiveChatId(currentChatId);

      if (supabaseClient && user?.id) {
        await supabaseClient.from('chats').insert([{
          id: currentChatId,
          user_id: user.id,
          title: newTitle,
          folder: DEFAULT_CATEGORY,
          pinned: false
        }]);
      }
    } else if (targetChat.messages.length === 0) {
      const newTitle = text.slice(0, 30) || 'Yeni Sohbet';
      setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, title: newTitle } : c));
      if (supabaseClient) {
        await supabaseClient.from('chats').update({ title: newTitle }).eq('id', currentChatId);
      }
    }

    const userMsgId = `msg-${Date.now()}`;
    const newUserMsg = { id: userMsgId, chat_id: currentChatId, role: 'user', content: requestText };

    setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, newUserMsg] } : c));
    setInputPrompt('');
    setAttachedFiles([]);
    setIsGenerating(true);
    const startedAt = performance.now();
    abortControllerRef.current = new AbortController();

    if (supabaseClient) {
      await supabaseClient.from('messages').insert([newUserMsg]);
    }

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (settings.apiKey) headers['Authorization'] = `Bearer ${settings.apiKey}`;

      const response = await fetch(`${cleanBaseUrl(settings.baseUrl)}/chat/completions`, {
        method: 'POST',
        headers,
        signal: abortControllerRef.current.signal,
        body: JSON.stringify({
          model: selectedModel || 'auto',
          messages: [
            { role: 'system', content: settings.systemPrompt },
            ...targetChat.messages.map(m => ({ role: m.role, content: m.content })),
            { role: 'user', content: requestText }
          ],
          temperature: settings.temperature,
          max_tokens: settings.maxTokens
        })
      });

      if (response && response.ok) {
        const data = await response.json();
        setLastUsage(data.usage || null);
        setLastResponseTime(Math.round(performance.now() - startedAt));
        const aiText = data.choices?.[0]?.message?.content || 'Yanıt alınamadı.';
        const aiMsgId = `msg-${Date.now() + 1}`;
        const newAiMsg = { id: aiMsgId, chat_id: currentChatId, role: 'assistant', content: aiText };

        setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, newAiMsg] } : c));

        if (supabaseClient) {
          await supabaseClient.from('messages').insert([newAiMsg]);
        }
      } else {
        const status = response ? response.status : 'bilinmiyor';
        let detail = '';
        try { detail = await response.text(); } catch (e) {}
        throw new Error(`API Yanıt Vermedi (HTTP ${status}) ${detail ? '- ' + detail.slice(0, 200) : ''}`);
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        setLastResponseTime(Math.round(performance.now() - startedAt));
        return;
      }
      const mockAiMsg = {
        id: `msg-${Date.now() + 1}`,
        chat_id: currentChatId,
        role: 'assistant',
        content: "⚠️ **Evren API Yanıt Uyarısı:**\n\nİstek proxy üzerinden gönderildi ancak geçerli bir sohbet yanıtı alınamadı.\n\n**Hata:** " + err.message + "\n\nAyarlar'daki Base URL şu proxy olmalı:\n`" + DEFAULT_BASE_URL + "`\n\nAudio/ASR modelleri sohbet isteklerinde kullanılamaz; model listesinden sohbet uyumlu bir model seçin veya `auto` kullanın."
      };
      setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, mockAiMsg] } : c));
      if (supabaseClient) {
        await supabaseClient.from('messages').insert([mockAiMsg]);
      }
    } finally {
      setIsGenerating(false);
      abortControllerRef.current = null;
    }
  };

  const stopGeneration = () => abortControllerRef.current?.abort();
  const retryLastRequest = () => {
    if (lastPromptRef.current) handleSendMessage(lastPromptRef.current);
  };

  const copyMessage = async (content) => {
    try {
      await navigator.clipboard.writeText(normalizeText(content));
    } catch (e) {
      window.alert('Mesaj panoya kopyalanamadı.');
    }
  };

  const editMessage = (message) => {
    setInputPrompt(message.content);
    setActiveChatId(message.chat_id);
  };

  const regenerateMessage = (chat, messageIndex) => {
    const previousUser = [...chat.messages.slice(0, messageIndex)].reverse().find(message => message.role === 'user');
    if (!previousUser) return;
    setInputPrompt(previousUser.content);
    setActiveChatId(chat.id);
  };

  const exportChat = (format) => {
    if (!activeChat) return;
    const title = normalizeText(activeChat.title || 'sohbet').replace(/[^\w\u00C0-\u024F -]/g, '').trim() || 'sohbet';
    let content;
    if (format === 'json') {
      content = JSON.stringify(activeChat, null, 2);
    } else if (format === 'txt') {
      content = activeChat.messages.map(message => `${message.role === 'user' ? 'Kullanıcı' : 'Evren'}: ${normalizeText(message.content)}`).join('\n\n');
    } else {
      content = `# ${title}\n\n${activeChat.messages.map(message => `## ${message.role === 'user' ? 'Kullanıcı' : 'Evren'}\n\n${normalizeText(message.content)}`).join('\n\n')}`;
    }
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${title}.${format === 'markdown' ? 'md' : format}`;
    link.click();
    URL.revokeObjectURL(link.href);
  };

  const renderInlineMarkdown = (text, keyPrefix) => {
    const parts = normalizeText(text).split(/(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)]+\))/g);
    return parts.map((part, index) => {
      if (part.startsWith('`') && part.endsWith('`')) {
        return <code key={`${keyPrefix}-code-${index}`} className="px-1.5 py-0.5 rounded bg-slate-950 text-cyan-300 font-mono text-[0.9em]">{part.slice(1, -1)}</code>;
      }
      if (part.startsWith('**') && part.endsWith('**')) {
        return <strong key={`${keyPrefix}-strong-${index}`} className="font-semibold text-white">{part.slice(2, -2)}</strong>;
      }
      const linkMatch = part.match(/^\[([^\]]+)\]\((https?:\/\/[^)]+)\)$/);
      if (linkMatch) {
        return <a key={`${keyPrefix}-link-${index}`} href={linkMatch[2]} target="_blank" rel="noreferrer" className="text-indigo-300 underline">{linkMatch[1]}</a>;
      }
      return <React.Fragment key={`${keyPrefix}-text-${index}`}>{part}</React.Fragment>;
    });
  };

  const renderMarkdownText = (content, keyPrefix) => normalizeText(content).split('\n').map((line, index) => {
    const key = `${keyPrefix}-${index}`;
    if (/^#{1,3}\s/.test(line)) {
      return <div key={key} className="text-lg font-bold text-white mt-3 mb-1">{renderInlineMarkdown(line.replace(/^#{1,3}\s+/, ''), key)}</div>;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      return <div key={key} className="flex gap-2 pl-2"><span className="text-indigo-300">•</span><span>{renderInlineMarkdown(line.replace(/^\s*[-*]\s+/, ''), key)}</span></div>;
    }
    return <div key={key} className="min-h-[1.4em]">{renderInlineMarkdown(line, key)}</div>;
  });

  const detectCodeLanguage = (code) => {
    if (/<(!doctype html|html|body|div)\b/i.test(code)) return 'html';
    if (/\b(const|let|function|console\.log|=>)\b/.test(code)) return 'javascript';
    if (/\b(def |import |print\(|class \w+\s*:)/.test(code)) return 'python';
    if (/[.#][\w-]+\s*\{[\s\S]*\}/.test(code)) return 'css';
    if (/^\s*[{[]/.test(code)) return 'json';
    return 'code';
  };

  const renderMessageContent = (content) => {
    const parts = normalizeText(content).split(/(```[\s\S]*?```)/g);
    return parts.map((part, index) => {
      if (part.startsWith('```')) {
        const firstLineEnd = part.indexOf('\n');
        const declaredLanguage = firstLineEnd > -1 ? part.slice(3, firstLineEnd).trim() : '';
        const language = declaredLanguage || detectCodeLanguage(part.slice(3, firstLineEnd > -1 ? firstLineEnd : -3));
        const codeText = part.slice(firstLineEnd + 1, -3).trim();
        const isPreviewable = ['html', 'javascript', 'js', 'svg', 'css'].includes(language.toLowerCase());

        return (
          <div key={index} className="my-4 rounded-xl border border-slate-800 bg-slate-950 overflow-hidden shadow-lg">
            <div className="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-slate-800 text-xs">
              <span className="font-mono text-indigo-400 font-semibold uppercase">{language}</span>
              <div className="flex items-center gap-2">
                {isPreviewable && (
                  <button
                    onClick={() => setActiveArtifact({ language, code: codeText })}
                    className="flex items-center gap-1.5 px-2.5 py-1 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 text-xs font-medium"
                  >
                    <IconPlay/> <span>Ön İzlemeyi Aç</span>
                  </button>
                )}
                <button
                  onClick={() => navigator.clipboard.writeText(codeText)}
                  className="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs"
                >
                  Kodu Kopyala
                </button>
              </div>
            </div>
            <pre className="p-4 overflow-x-auto text-sm font-mono text-slate-200"><code>{codeText}</code></pre>
          </div>
        );
      }
      return <div key={index} className="leading-relaxed text-slate-200 text-sm md:text-base">{renderMarkdownText(part, `message-${index}`)}</div>;
    });
  };

  const filteredChats = chats
    .filter(c => selectedCategory === 'Tümü' || (c.folder || DEFAULT_CATEGORY) === selectedCategory)
    .filter(c => c.title.toLowerCase().includes(searchQuery.toLowerCase()))
    .sort((a, b) => sortMode === 'alphabetical'
      ? a.title.localeCompare(b.title, 'tr')
      : new Date(b.updated_at || 0) - new Date(a.updated_at || 0));
  const pinnedChats = filteredChats.filter(chat => chat.pinned);
  const regularChats = filteredChats.filter(chat => !chat.pinned);

  if (!user) {
    return (
      <div className="min-h-screen bg-[#090d16] flex items-center justify-center p-4 relative overflow-hidden font-sans">
        <div className="absolute w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-3xl -top-32 -left-32 pointer-events-none"></div>
        <div className="absolute w-[500px] h-[500px] bg-pink-600/15 rounded-full blur-3xl -bottom-32 -right-32 pointer-events-none"></div>

        <div className="max-w-md w-full bg-[#0f1523]/90 backdrop-blur-2xl border border-slate-800/80 rounded-3xl p-8 shadow-2xl relative z-10">
          <div className="flex flex-col items-center text-center mb-8">
            <div className="w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center mb-4 shadow-xl shadow-indigo-500/20">
              <IconSparkles/>
            </div>
            <h1 className="text-2xl font-extrabold text-white tracking-tight">EVREN AI PORTAL</h1>
            <p className="text-slate-400 text-xs mt-1.5">
              {isRegistering ? 'Yeni bir hesap oluşturun' : 'Devam etmek için hesabınıza giriş yapın'}
            </p>
          </div>

          <form onSubmit={handleAuthSubmit} className="space-y-4">
            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
                E-posta Adresi
              </label>
              <div className="relative flex items-center">
                <span className="absolute left-3.5"><IconMail/></span>
                <input
                  type="email"
                  required
                  value={emailInput}
                  onChange={e => setEmailInput(e.target.value)}
                  placeholder="eposta@evren.com"
                  className="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
                Şifre
              </label>
              <div className="relative flex items-center">
                <span className="absolute left-3.5"><IconLock/></span>
                <input
                  type="password"
                  required
                  value={passwordInput}
                  onChange={e => setPasswordInput(e.target.value)}
                  placeholder="••••••••"
                  className="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                />
              </div>
            </div>

            <button
              type="submit"
              disabled={loadingAuth}
              className="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 via-indigo-500 to-pink-500 hover:opacity-95 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-600/25 active:scale-[0.98] mt-2 disabled:opacity-50"
            >
              {loadingAuth ? 'İşleniyor...' : (isRegistering ? 'Kayıt Ol' : 'Giriş Yap')}
            </button>
          </form>

          <div className="mt-6 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-400">
            {isRegistering ? (
              <span>Zaten hesabınız var mı? <button onClick={() => setIsRegistering(false)} className="text-indigo-400 font-semibold hover:underline">Giriş Yapın</button></span>
            ) : (
              <span>Hesabınız yok mu? <button onClick={() => setIsRegistering(true)} className="text-indigo-400 font-semibold hover:underline">Hemen Kayıt Olun</button></span>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={`flex h-screen text-slate-100 font-sans overflow-hidden ${theme === 'light' ? 'bg-slate-100 text-slate-900' : 'bg-[#090d16]'} ${fontScale === 'large' ? 'text-lg' : fontScale === 'small' ? 'text-sm' : ''}`}>

      {/* SIDEBAR */}
      <aside className={`${sidebarOpen ? 'w-72 md:w-80' : 'w-0'} transition-all duration-300 bg-[#0f1523] border-r border-slate-800/80 flex flex-col z-20 relative overflow-hidden`}>
        <div className="p-4 border-b border-slate-800/60 flex flex-col gap-3">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center">
                <IconSparkles/>
              </div>
              <span className="font-bold text-base text-white">EVREN AI INTERFACE</span>
            </div>
          </div>
          <button onClick={handleNewChat} className="flex items-center justify-center gap-2 w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium transition">
            <IconPlus/> <span>Yeni Sohbet</span>
          </button>
        </div>

        <div className="px-4 py-3">
          <div className="relative">
            <span className="absolute inset-y-0 left-3 flex items-center"><IconSearch/></span>
            <input
              type="text" placeholder="Sohbetlerde ara..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
              className="w-full bg-slate-900 text-sm text-slate-200 pl-9 pr-3 py-2 rounded-xl border border-slate-800 focus:outline-none"
            />
          </div>
          <div className="flex items-center gap-2 mt-2">
            <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)} className="flex-1 bg-slate-900 text-xs text-slate-200 px-2.5 py-2 rounded-xl border border-slate-800">
              <option value="Tümü">Tüm kategoriler</option>
              {categories.map(category => <option key={category} value={category}>{category}</option>)}
            </select>
            <button onClick={createCategory} className="px-2.5 py-2 rounded-xl bg-slate-800 text-indigo-300 text-xs" title="Kategori oluştur">+ Kategori</button>
          </div>
          <div className="flex items-center gap-2 mt-2">
            <select value={sortMode} onChange={e => setSortMode(e.target.value)} className="flex-1 bg-slate-900 text-[10px] text-slate-300 px-2 py-1.5 rounded-lg border border-slate-800">
              <option value="recent">Son güncellenen</option>
              <option value="alphabetical">Alfabetik</option>
            </select>
            {selectedCategory !== 'Tümü' && <input type="color" value={categoryColors[selectedCategory] || '#6366f1'} onChange={e => setCategoryColors(current => ({ ...current, [selectedCategory]: e.target.value }))} title="Kategori rengi" className="w-8 h-7 rounded bg-slate-900 border border-slate-800" />}
          </div>
        </div>

        <div className="flex-1 overflow-y-auto px-3 py-2 space-y-2 custom-scrollbar">
          {pinnedChats.length > 0 && (
            <div className="space-y-1">
              <div className="px-2 text-[10px] uppercase tracking-wider text-amber-300">Sabitlenen sohbetler</div>
              {pinnedChats.map(chat => (
                <ChatRow key={chat.id} chat={chat} activeChatId={activeChatId} setActiveChatId={setActiveChatId} togglePin={togglePin} renameChat={renameChat} deleteChat={deleteChat} assignCategory={assignCategory} categoryColors={categoryColors} />
              ))}
            </div>
          )}
          <div className="px-2 pt-2 text-[10px] uppercase tracking-wider text-slate-500">Sohbetler</div>
          {regularChats.map(chat => (
            <ChatRow key={chat.id} chat={chat} activeChatId={activeChatId} setActiveChatId={setActiveChatId} togglePin={togglePin} renameChat={renameChat} deleteChat={deleteChat} assignCategory={assignCategory} categoryColors={categoryColors} />
          ))}
          {filteredChats.length === 0 && <div className="px-2 py-6 text-xs text-slate-500">Sohbet bulunamadı.</div>}
        </div>

        <div className="p-3 border-t border-slate-800 bg-slate-900/50 flex items-center justify-between">
          <div className="flex items-center gap-2 overflow-hidden">
            <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">
              {user.email ? user.email.substring(0, 2).toUpperCase() : 'EŞ'}
            </div>
            <div className="flex flex-col truncate">
              <span className="text-xs font-medium text-white truncate">{user.email}</span>
              <span className="text-[10px] text-emerald-400">● Oturum Açık</span>
            </div>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            <button onClick={() => setShowSettings(true)} className="p-2 text-slate-400 hover:text-white" title="API Ayarları"><IconSettings/></button>
            <button onClick={handleLogout} className="p-2 text-slate-400 hover:text-rose-400" title="Çıkış Yap"><IconLogout/></button>
          </div>
        </div>
      </aside>

      {/* MAIN CONTENT */}
      <main className="flex-1 flex flex-col h-full relative overflow-hidden">
        <header className="h-16 border-b border-slate-800/80 bg-[#0f1523]/80 px-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            {!sidebarOpen && <button onClick={() => setSidebarOpen(true)} className="p-2 text-slate-400 hover:text-white"><IconSparkles/></button>}

            <div className="relative">
              <button onClick={() => setModelDropdownOpen(!modelDropdownOpen)} className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-sm font-medium">
                <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>{availableModels.find(m => m.id === selectedModel)?.name || selectedModel || 'Model Seçin'}</span>
              </button>

              {modelDropdownOpen && (
                <div className="absolute top-12 left-0 w-80 bg-slate-900 border border-slate-800 rounded-2xl p-2 z-50 shadow-2xl space-y-1 max-h-96 overflow-y-auto custom-scrollbar">
                  {availableModels.map(m => (
                    <button key={m.id} onClick={() => { setSelectedModel(m.id); setModelDropdownOpen(false); }} className={`w-full text-left px-3 py-2 rounded-xl text-xs flex flex-col transition ${selectedModel === m.id ? 'bg-indigo-600/30 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>
                      <span className="font-semibold text-white">{m.name}</span>
                      {m.desc && <span className="text-[10px] text-slate-400 mt-0.5">{m.desc}</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="flex items-center gap-2">
            {lastUsage && <span className="hidden md:inline text-[10px] text-slate-500">{lastUsage.total_tokens || 0} token · {lastResponseTime || 0} ms</span>}
            <select onChange={e => exportChat(e.target.value)} defaultValue="" className="bg-slate-900 border border-slate-800 text-[10px] text-slate-300 rounded-xl px-2 py-1.5">
              <option value="" disabled>Dışa aktar</option>
              <option value="markdown">Markdown</option>
              <option value="txt">TXT</option>
              <option value="json">JSON</option>
            </select>
            <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="px-2 py-1.5 bg-slate-900 border border-slate-800 text-[10px] text-slate-300 rounded-xl">{theme === 'dark' ? 'Açık tema' : 'Koyu tema'}</button>
            <button onClick={() => setCompactMode(current => !current)} className="px-2 py-1.5 bg-slate-900 border border-slate-800 text-[10px] text-slate-300 rounded-xl">Kompakt</button>
            <button onClick={retryLastRequest} disabled={!lastPromptRef.current || isGenerating} className="px-2 py-1.5 bg-slate-900 border border-slate-800 text-[10px] text-slate-300 rounded-xl disabled:opacity-40">Yeniden dene</button>
            <button onClick={handleFetchModelsFromApi} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 border border-slate-800 text-xs text-slate-300 rounded-xl hover:bg-slate-800 transition">
              <IconRefresh/> <span>{isFetchingModels ? 'Yükleniyor...' : "Modelleri Yenile"}</span>
            </button>
          </div>
        </header>

        <div className="flex-1 flex overflow-hidden">
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scrollbar">
              {!activeChat || activeChat.messages.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center space-y-6 py-12">
                  <div className="w-16 h-16 rounded-3xl bg-indigo-600 flex items-center justify-center shadow-2xl"><IconSparkles/></div>
                  <h1 className="text-3xl font-bold text-white">Evren AI Modeline Hoş Geldiniz</h1>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-xl w-full">
                    {['React Tailwind Dashboard Yap', 'Python Web Scraper Yaz', 'API Performans Analizi', 'Sistem Prompt Özelleştirme'].map((t, idx) => (
                      <button key={idx} onClick={() => handleSendMessage(t)} className="p-4 rounded-2xl bg-slate-900 border border-slate-800 text-left hover:border-indigo-500 text-sm text-slate-300">
                        {t}
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                activeChat.messages.map((msg, messageIndex) => (
                  <div key={msg.id} className={`flex gap-4 max-w-4xl mx-auto ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    {msg.role === 'assistant' && <div className="w-9 h-9 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shrink-0"><IconSparkles/></div>}
                    <div className={`rounded-2xl ${compactMode ? 'p-3' : 'p-5'} max-w-[80%] ${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-[#0f1523] border border-slate-800 text-slate-200'}`}>
                      {renderMessageContent(msg.content)}
                      <div className="flex items-center gap-2 mt-3 pt-2 border-t border-white/10 opacity-70">
                        <button onClick={() => copyMessage(msg.content)} className="text-[10px] hover:text-white">Kopyala</button>
                        {msg.role === 'user' && <button onClick={() => editMessage(msg)} className="text-[10px] hover:text-white">Düzenle</button>}
                        {msg.role === 'assistant' && <button onClick={() => regenerateMessage(activeChat, messageIndex)} className="text-[10px] hover:text-white">Yeniden kullan</button>}
                      </div>
                    </div>
                  </div>
                ))
              )}

              {isGenerating && (
                <div className="flex gap-4 max-w-4xl mx-auto justify-start">
                  <div className="w-9 h-9 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shrink-0"><IconSparkles/></div>
                  <div className="rounded-2xl px-5 py-4 bg-[#0f1523] border border-slate-800 text-slate-400 text-sm">
                    Yanıt yazılıyor...
                  </div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            <div className="p-4 bg-[#090d16] border-t border-slate-800">
              <div onDragOver={e => { e.preventDefault(); setDragActive(true); }} onDragLeave={() => setDragActive(false)} onDrop={handleDrop} className={`max-w-4xl mx-auto bg-slate-900 border rounded-3xl p-3 flex items-center gap-2 ${dragActive ? 'border-indigo-400 bg-indigo-950/30' : 'border-slate-800'}`}>
                <input type="file" ref={fileInputRef} multiple accept=".txt,.md,.markdown,.csv,.json,.pdf,.html,.css,.js,.png,.jpg,.jpeg,.webp,.gif,text/plain,text/markdown,text/csv,application/json,application/pdf,image/png,image/jpeg,image/webp,image/gif" onChange={handleFileUpload} className="hidden" />
                <button onClick={() => fileInputRef.current?.click()} className="p-2 text-slate-400 hover:text-white" title="Dosya ekle"><IconPaperclip/></button>
                <textarea
                  rows="1" value={inputPrompt} onChange={e => setInputPrompt(e.target.value)}
                  onPaste={handlePaste}
                  onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } }}
                  placeholder="Evren AI'a bir şey sorun..." className="flex-1 bg-transparent text-slate-100 text-sm focus:outline-none resize-none"
                />
                {isGenerating ? <button onClick={stopGeneration} className="px-3 py-2 bg-rose-600 text-white rounded-2xl text-xs">Durdur</button> : <button onClick={() => handleSendMessage()} className="p-3 bg-indigo-600 text-white rounded-2xl"><IconSend/></button>}
              </div>
              {attachedFiles.length > 0 && (
                <div className="max-w-4xl mx-auto flex flex-wrap gap-2 mt-2">
                  {attachedFiles.map((file, index) => (
                    <div key={`${file.name}-${index}`} className="relative max-w-[220px] rounded-lg bg-slate-800 p-2 text-xs text-slate-300">
                      {file.previewUrl && file.type.startsWith('image/') && <img src={file.previewUrl} alt={file.name} className="max-h-24 max-w-full rounded mb-1" />}
                      {file.previewUrl && file.type === 'application/pdf' && <iframe src={file.previewUrl} title={file.name} className="h-24 w-full rounded mb-1" />}
                      {file.textPreview && <pre className="max-h-20 overflow-hidden whitespace-pre-wrap text-[10px] text-slate-400 mb-1">{file.textPreview}</pre>}
                      <button onClick={() => setAttachedFiles(current => current.filter((_, itemIndex) => itemIndex !== index))} className="hover:text-white" title="Eki kaldır">
                        {file.name} · {file.sizeLabel} ×
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <p className="max-w-4xl mx-auto mt-2 text-[10px] text-slate-600">Ekler 10 MB ile sınırlıdır. Metin/JSON dosyalarının yalnızca ilk 8000 karakteri isteğe eklenir; PDF için yalnızca dosya adı ve metadata gönderilir.</p>
            </div>
          </div>

          {activeArtifact && (
            <div className="w-[500px] border-l border-slate-800 bg-[#0c101d] flex flex-col h-full">
              <div className="h-14 px-4 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center gap-2"><IconCode/><span className="text-sm font-semibold text-white">Canlı Kod Ön İzleme</span></div>
                <button onClick={() => setActiveArtifact(null)} className="p-1 text-slate-400 hover:text-white"><IconX/></button>
              </div>
              <div className="flex-1 bg-slate-950">
                <iframe title="Artifact Preview" srcDoc={activeArtifact.code} className="w-full h-full bg-white" sandbox="allow-scripts" />
              </div>
            </div>
          )}
        </div>
      </main>

      {showSettings && (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-[#0f1523] border border-slate-800 rounded-3xl max-w-lg w-full p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-bold text-white">Evren API Ayarları</h3>
              <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white"><IconX/></button>
            </div>
            <div className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-300 font-semibold mb-1">Base URL (Evren API Sunucusu)</label>
                <input type="text" value={settings.baseUrl} onChange={e => setSettings({ ...settings, baseUrl: e.target.value })} className="w-full bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-white" />
                <p className="text-[10px] text-slate-500 mt-1">Önerilen: {DEFAULT_BASE_URL}</p>
              </div>
              <div>
                <label className="block text-slate-300 font-semibold mb-1">Evren API Key (Gerekliyse)</label>
                <input type="password" placeholder="sk-evren-xxx" value={settings.apiKey} onChange={e => setSettings({ ...settings, apiKey: e.target.value })} className="w-full bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-white" />
              </div>
              <div className="flex items-center gap-2">
                <label className="text-slate-300 font-semibold">Yazı boyutu</label>
                <select value={fontScale} onChange={e => setFontScale(e.target.value)} className="bg-slate-900 p-2 rounded-xl border border-slate-800 text-white">
                  <option value="small">Küçük</option>
                  <option value="normal">Normal</option>
                  <option value="large">Büyük</option>
                </select>
              </div>
            </div>
            <div className="flex justify-end pt-3 gap-2">
              <button onClick={() => setSettings({ ...settings, baseUrl: DEFAULT_BASE_URL })} className="px-4 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-medium">Varsayılana Sıfırla</button>
              <button onClick={() => setShowSettings(false)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-medium">Kaydet</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
